<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DataFlow NG: Buy data and airtime</title>
<meta name="description" content="Fast, affordable data and airtime, delivered instantly.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='9' fill='%234338ca'/><path d='M8 20c4-8 8 4 16-4' stroke='white' stroke-width='3' fill='none' stroke-linecap='round'/></svg>">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f6fb;--card:#fff;--ink:#141a33;--mut:#5d6585;--line:#e3e6f2;--ac:#4338ca;--ac2:#312e81;--ok:#0a7f4f;--warn:#a15c00;--bad:#b42318}
@media(prefers-color-scheme:dark){:root:not([data-t=light]){--bg:#0e1124;--card:#171b35;--ink:#eef0fb;--mut:#a3aad0;--line:#2a2f55;--ac:#818cf8;--ac2:#c7d2fe;--ok:#4ade80;--warn:#fbbf24;--bad:#f87171}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Figtree,system-ui,sans-serif;padding-bottom:80px}
h1,h2,h3{font-family:'Bricolage Grotesque',sans-serif;margin:0;line-height:1.1}
.wrap{max-width:560px;margin:0 auto;padding:16px}
.top{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;max-width:560px;margin:auto}
.logo{font:800 20px 'Bricolage Grotesque';color:var(--ac2)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px}
.bal{background:var(--ac);color:#fff;border:0;border-radius:26px}.bal h2{font-size:40px;margin:4px 0 14px}
.btn{font:600 16px Figtree;border:0;border-radius:12px;padding:13px 18px;cursor:pointer;background:var(--ac);color:#fff;min-height:48px}
.btn.alt{background:var(--card);color:var(--ink);border:1px solid var(--line)}.btn.w{width:100%}.btn:disabled{opacity:.5;cursor:wait}
.bal .btn{background:#fff;color:#312e81;margin-right:8px}
input{width:100%;font:16px Figtree;padding:13px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);margin:6px 0 12px}
label{font-weight:600;font-size:14px}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.nets{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:8px 0 14px}
.net{padding:12px 4px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);font-weight:600;cursor:pointer}
.net[aria-pressed=true],.plan[aria-pressed=true]{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 12%,var(--card))}
.plans{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.plan{text-align:left;padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.plan b{font:800 20px 'Bricolage Grotesque'}.plan small{display:block;color:var(--mut)}
.row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}
.st{font-size:13px;font-weight:600;padding:3px 9px;border-radius:99px;border:1px solid currentColor}
.successful,.credit,.funding{color:var(--ok)}.failed{color:var(--bad)}.processing,.pending{color:var(--warn)}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 0 10px}
nav button{background:none;border:0;color:var(--mut);font:600 13px Figtree;padding:8px 14px;cursor:pointer;min-height:44px}nav button[aria-current=page]{color:var(--ac)}
.modal{position:fixed;inset:0;background:#0009;display:flex;align-items:flex-end;justify-content:center;z-index:9}
.modal>div{background:var(--card);width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:22px}
.msg{color:var(--bad);min-height:22px;font-size:14px}.hide{display:none!important}.mut{color:var(--mut)}
.badge{background:var(--warn);color:#fff;font-size:12px;padding:2px 8px;border-radius:99px;margin-left:6px}
.skel{height:56px;border-radius:12px;background:var(--line);animation:p 1.2s infinite alternate}@keyframes p{to{opacity:.4}}
@media(prefers-reduced-motion:reduce){.skel{animation:none}}
</style></head><body>
<div class="top"><span class="logo" id="brand">DataFlow NG</span><button class="btn alt" id="out" onclick="logout()" hidden>Log out</button></div>
<main class="wrap" id="app"></main><nav id="nav" hidden></nav><div id="modal"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
// The anon key is designed to be public. Security comes from RLS + server-side functions in db/schema.sql.
const SUPABASE_URL='https://qlhwuwcrcdwkfjhuwhej.supabase.co';
const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFsaHd1d2NyY2R3a2ZqaHV3aGVqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEwODExNDEsImV4cCI6MjEwNjY1NzE0MX0.uO2Nh0aeDlsmgHn1uue2oTzsrksmkI8rhDYHPIOFYuE';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const $=s=>document.querySelector(s),app=$('#app'),naira=n=>'₦'+Number(n).toLocaleString('en-NG',{minimumFractionDigits:2});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let me,prof,bal=0,sel={net:null,plan:null,phone:''},plans=[],idem=null,view='home',mode='login';
const STATUS={successful:'✓ Successful',failed:'✕ Failed',processing:'… Processing',pending:'… Pending'};

async function init(){const{data:{session}}=await sb.auth.getSession();me=session?.user;sb.auth.onAuthStateChange((_,s)=>{if(!s&&me){me=null;render()}});me?await load():render()}
async function load(){app.innerHTML='<div class="skel"></div>';
 const[p,w]=await Promise.all([sb.from('profiles').select('name,referral_code').single(),sb.from('wallets').select('balance').single()]);
 prof=p.data;bal=w.data?.balance??0;render()}
function render(){
 $('#out').hidden=!me;$('#nav').hidden=!me;
 if(!me)return authView();
 $('#nav').innerHTML=[['home','Home'],['data','Buy data'],['wallet','Wallet'],['tx','History']].map(([k,l])=>`<button aria-current="${view==k?'page':'false'}" onclick="go('${k}')">${l}</button>`).join('');
 ({home:homeView,data:dataView,wallet:walletView,tx:txView,done:doneView})[view]()}
function go(v){view=v;render()}
function authView(){const reg=mode=='register';
 app.innerHTML=`<div class="card"><h1 style="font-size:34px">Buy data. Stay connected.</h1><p class="mut">Fast, affordable and reliable digital services.</p>
 <form id="af" novalidate>${reg?`<label for="n">Full name</label><input id="n" autocomplete="name" required><label for="ph">Phone number</label><input id="ph" inputmode="numeric" placeholder="08012345678" required>`:''}
 <label for="e">Email</label><input id="e" type="email" autocomplete="email" required>
 <label for="pw">Password</label><input id="pw" type="password" autocomplete="${reg?'new-password':'current-password'}" minlength="8" required>
 <div class="msg" id="m" role="alert"></div><button class="btn w" id="sb">${reg?'Create account':'Log in'}</button></form>
 <p style="text-align:center"><a href="#" onclick="mode='${reg?'login':'register'}';render();return false">${reg?'I already have an account':'Create an account'}</a></p></div>`;
 $('#af').onsubmit=async ev=>{ev.preventDefault();const b=$('#sb');b.disabled=true;$('#m').textContent='';
  const email=$('#e').value.trim(),password=$('#pw').value;let r;
  if(reg){const phone=$('#ph').value.trim();if(!/^0[789][01]\d{8}$/.test(phone)||password.length<8){b.disabled=false;return $('#m').textContent='Enter a valid Nigerian phone number and a password of 8+ characters.'}
   r=await sb.auth.signUp({email,password,options:{data:{name:$('#n').value.trim(),phone}}})}
  else r=await sb.auth.signInWithPassword({email,password});
  b.disabled=false;if(r.error)return $('#m').textContent=r.error.message;
  if(!r.data.session)return $('#m').textContent='Check your email to confirm your account, then log in.';
  me=r.data.user;load()}}
async function logout(){await sb.auth.signOut();me=null;view='home';render()}
function homeView(){app.innerHTML=`<div class="card bal"><span>Welcome, ${esc(prof?.name?.split(' ')[0]||'')} 👋<br>Wallet balance</span><h2>${naira(bal)}</h2>
 <button class="btn" onclick="go('wallet')">Fund wallet</button><button class="btn" onclick="go('data')">Buy data</button></div>
 <div class="card"><h3>Recent activity</h3><div id="rc"></div></div>`;txList('#rc',5)}
async function dataView(){sel={net:null,plan:null,phone:''};idem=crypto.randomUUID();
 app.innerHTML='<div class="card"><h2>Buy data</h2><div class="skel" style="margin-top:12px"></div></div>';
 const r=await sb.from('plans_public').select('*').order('selling_price');plans=r.data||[];drawData()}
function drawData(){const nets=['MTN','Airtel','Glo','9mobile'],ps=plans.filter(p=>p.network==sel.net),pl=plans.find(p=>p.id==sel.plan);
 app.innerHTML=`<div class="card"><h2>Buy data</h2><label>Network</label><div class="nets">${nets.map(n=>`<button class="net" aria-pressed="${sel.net==n}" onclick="sel.net='${n}';sel.plan=null;drawData()">${n}</button>`).join('')}</div>
 <label for="ph">Phone number</label><input id="ph" inputmode="numeric" maxlength="11" placeholder="08012345678" value="${esc(sel.phone)}" oninput="sel.phone=this.value">
 ${sel.net?(ps.length?`<label>Plan</label><div class="plans">${ps.map(p=>`<button class="plan" aria-pressed="${sel.plan==p.id}" onclick="sel.plan='${p.id}';drawData()"><b>${esc(p.name)}</b><small>${esc(p.validity)}</small>${naira(p.selling_price)}</button>`).join('')}</div>`:'<p class="mut">No plans available for this network right now.</p>'):'<p class="mut">Choose a network to see plans.</p>'}
 ${pl?`<p class="mut">Balance after: ${naira(bal-pl.selling_price)}</p>`:''}
 <div class="msg" id="m" role="alert"></div><button class="btn w" onclick="confirmBuy()" ${pl?'':'disabled'}>Buy now</button></div>`}
function confirmBuy(){const pl=plans.find(p=>p.id==sel.plan);
 if(!/^0[789][01]\d{8}$/.test(sel.phone))return $('#m').textContent='Enter a valid 11-digit phone number.';
 if(bal<pl.selling_price)return $('#m').textContent='Insufficient wallet balance. Fund your wallet to continue.';
 $('#modal').innerHTML=`<div class="modal" role="dialog" aria-modal="true"><div><h2>Confirm purchase</h2><p><b>${esc(pl.network)} ${esc(pl.name)}</b> to <b>${esc(sel.phone)}</b></p>
 <p>Amount: <b>${naira(pl.selling_price)}</b><br>Balance after: <b>${naira(bal-pl.selling_price)}</b></p><div class="msg" id="mm" role="alert"></div>
 <button class="btn w" id="cb" onclick="buy()">Confirm purchase</button><br><br><button class="btn alt w" onclick="$('#modal').innerHTML=''">Cancel</button></div></div>`}
async function buy(){const b=$('#cb');b.disabled=true;b.textContent='Purchasing data…';
 const{data,error}=await sb.rpc('buy_data',{p_plan:sel.plan,p_phone:sel.phone,p_idem:idem});
 if(error){b.disabled=false;b.textContent='Confirm purchase';return $('#mm').textContent=error.message.includes('Insufficient')?'Insufficient wallet balance.':error.message.includes('Invalid')?'Invalid phone number.':'Something went wrong. Please try again.'}
 $('#modal').innerHTML='';sel.done=data;const w=await sb.from('wallets').select('balance').single();bal=w.data.balance;view='done';render()}
function doneView(){const t=sel.done;app.innerHTML=`<div class="card" style="text-align:center"><h2>${t.status=='successful'?'🎉 Purchase successful':'Your order is being processed'}</h2>
 <p>${esc(t.network)} ${esc(t.plan_name)} for ${esc(t.phone)}<br>${naira(t.selling_price)}</p><p class="st ${esc(t.status)}" style="display:inline-block">${STATUS[t.status]||esc(t.status)}</p>
 <p class="mut">Ref: ${esc(t.reference)}<br>We only mark it successful once the provider confirms. Failed orders are refunded automatically.</p>
 <button class="btn w" onclick="go('data')">Buy again</button><br><br><button class="btn alt w" onclick="go('home')">Back to dashboard</button></div>`}
function walletView(){app.innerHTML=`<div class="card"><h2>Fund wallet</h2><p class="mut">Balance: ${naira(bal)}</p><label for="amt">Amount (₦)</label><input id="amt" type="number" min="100" placeholder="5000">
 <div class="msg" id="m" role="alert"></div><button class="btn w" onclick="fund()">Continue to payment</button>
 <p class="mut" style="font-size:14px">Payments are credited automatically after your provider confirms them. No manual approval.</p></div>`}
async function fund(){const a=+$('#amt').value;if(!(a>=100))return $('#m').textContent='Minimum funding amount is ₦100.';
 // Calls your server function (Supabase Edge Function) that creates the payment reference and returns the gateway checkout URL.
 const{data,error}=await sb.functions.invoke('init-payment',{body:{amount:a}});
 if(error||!data?.url)return $('#m').textContent='Payments are not connected yet. Deploy the init-payment function and add your gateway keys.';
 location.href=data.url}
async function txList(sel_,limit){const el=$(sel_);el.innerHTML='<div class="skel"></div>';
 const{data}=await sb.from('vtu_transactions').select('reference,network,plan_name,phone,selling_price,status,created_at').order('created_at',{ascending:false}).limit(limit);
 el.innerHTML=data?.length?data.map(t=>`<div class="row"><div><b>${esc(t.network)} ${esc(t.plan_name)}</b><br><span class="mut" style="font-size:14px">${esc(t.phone)} · ${new Date(t.created_at).toLocaleString('en-NG',{dateStyle:'medium',timeStyle:'short'})}</span></div><div style="text-align:right">${naira(t.selling_price)}<br><span class="st ${esc(t.status)}">${STATUS[t.status]||esc(t.status)}</span></div></div>`).join(''):'<p class="mut">No transactions yet. Buy your first data plan.</p>'}
function txView(){app.innerHTML='<div class="card"><h2>Transactions</h2><div id="tl"></div></div>';txList('#tl',50)}
init();
</script></body></html>
